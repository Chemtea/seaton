name: Build and release Windows

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REQUESTED_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      BOOTSTRAP_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Select release and prepare missing version tag
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable three-part version is required.' }
          $tag = "v$version"
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -ne $tag) { throw 'The selected tag does not match package.json.' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the checked-out source commit.' }
          if ($env:BOOTSTRAP_RELEASE -eq 'true' -and $head -ne $env:GITHUB_SHA) { throw 'The checked-out source differs from the main push.' }
          $release = $null
          $releaseJson = gh release view $tag --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) { $release = $releaseJson | ConvertFrom-Json }
          if ($release -and !$release.isDraft) {
            Write-Host "$tag is already public. Increase the version to publish changes."
            'publish=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $tagCommit = git rev-parse --verify --quiet "refs/tags/${tag}^{commit}"
          if ($LASTEXITCODE -eq 0) {
            if ($tagCommit -ne $head) { throw 'The version tag belongs to another commit. Increase the version; existing tags are never moved.' }
          } else {
            if ($env:BOOTSTRAP_RELEASE -ne 'true') { throw 'The requested release tag does not exist.' }
            if ($release) {
              $draftCommit = git rev-parse --verify --quiet "$($release.targetCommitish)^{commit}"
              if ($LASTEXITCODE -ne 0 -or $draftCommit -ne $head) { throw 'The existing draft targets another source commit.' }
            }
            git tag $tag $head
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create the version tag.' }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot publish the version tag. Existing tags are never replaced.' }
          }
          'publish=true' >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci --no-audit --no-fund
      - name: Verify version and source tag
        if: steps.release.outputs.publish == 'true'
        run: npm run release:verify
      - name: Test application logic
        if: steps.release.outputs.publish == 'true'
        run: npm test
      - name: Verify native Windows renderer
        if: steps.release.outputs.publish == 'true'
        run: node scripts/verify-ui.cjs
      - name: Upload renderer screenshots and checks
        if: always() && steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-check
          path: dist/ui-check/
          if-no-files-found: warn
          retention-days: 14
      - name: Build Windows installer and portable executable
        if: steps.release.outputs.publish == 'true'
        run: npm run build:win
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Verify release assets
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $required = @("dist/Seaton-Setup-$version-x64.exe", "dist/Seaton-Setup-$version-x64.exe.blockmap", "dist/Seaton-Portable-$version-x64.exe", 'dist/latest.yml')
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing release asset: $file" }
          }
      - name: Publish complete GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @("dist/Seaton-Setup-$version-x64.exe", "dist/Seaton-Setup-$version-x64.exe.blockmap", "dist/Seaton-Portable-$version-x64.exe", 'dist/latest.yml')
          gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
            if ($draft -ne 'true') { throw 'This version is already public. Increase the version instead of replacing a published release.' }
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "자리온 $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
